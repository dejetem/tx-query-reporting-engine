services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reporting
      POSTGRES_PASSWORD: reporting_dev_password
      POSTGRES_DB: tx_reporting
    ports:
      - "5433:5432"
    volumes:
      - pg_reporting_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reporting -d tx_reporting"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.55.0
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3001
      DATABASE_URL: postgres://reporting:reporting_dev_password@postgres:5432/tx_reporting
      REDIS_URL: redis://redis:6379
      EXPORT_DIR: /tmp/exports
      OTEL_TRACES_EXPORTER: none
      OTEL_SDK_DISABLED: "true"
      LOG_LEVEL: warn
    ports:
      - "3001:3001"

volumes:
  pg_reporting_data:
